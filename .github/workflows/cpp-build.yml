name: C++ Build and Test

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'src/cpp/**'
      - '.github/workflows/cpp-build.yml'
      - 'CMakeLists.txt'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'src/cpp/**'
      - '.github/workflows/cpp-build.yml'
      - 'CMakeLists.txt'
  release:
    types: [created]

env:
  BUILD_TYPE: Release
  CPP_DIR: src/cpp

jobs:
  build:
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: metadata-worker-linux
            compiler: gcc
          - os: windows-latest
            artifact_name: metadata-worker-windows.exe
            compiler: msvc
          - os: macos-latest
            artifact_name: metadata-worker-macos
            compiler: clang

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake ninja-build

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install cmake ninja

    - name: Configure CMake
      run: |
        cmake -S ${{ env.CPP_DIR }} -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -G Ninja
      shell: bash

    - name: Build
      run: cmake --build build --config ${{ env.BUILD_TYPE }}
      shell: bash

    - name: Test
      working-directory: build
      run: ctest -C ${{ env.BUILD_TYPE }} --output-on-failure
      shell: bash
      continue-on-error: true

    - name: Rename binary (Windows)
      if: runner.os == 'Windows'
      run: |
        cd build
        cp ${{ env.BUILD_TYPE }}/metadata-worker.exe ${{ matrix.artifact_name }}
      shell: bash

    - name: Rename binary (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        cd build
        cp metadata-worker ${{ matrix.artifact_name }}
      shell: bash

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}-${{ runner.os }}
        path: build/${{ matrix.artifact_name }}
        retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Prepare release assets
      run: |
        cd artifacts
        for dir in */; do
          cd "$dir"
          zip ../${{ github.event.release.tag_name }}-$(basename "$dir").zip *
          cd ..
        done

    - name: Upload release assets
      uses: softprops/action-gh-release@v1
      with:
        files: artifacts/*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
